name: ktn repo

# Builds yeetbin-app for Arch, signs it, and publishes a self-contained pacman
# repository as release assets under the fixed `ktn-repo` tag.
#
# This repository owns its database exclusively — nothing else writes to
# [ktn-yeetbin]. That is deliberate: the sibling [ktn-trilium] repo is published the
# same way from Kautiontape/trilium, and keeping one database per project means neither
# workflow can evict the other's package when it re-indexes.
#
# Client setup lives in packaging/arch/README.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ktn-repo
  cancel-in-progress: true

permissions:
  contents: write

env:
  REPO_NAME: ktn-yeetbin
  RELEASE_TAG: ktn-repo

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # rev-list count feeds the dev pkgver

      - name: Resolve version
        id: vers
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PKGVER="${GITHUB_REF#refs/tags/v}"
          else
            # Untagged dispatch: derive a monotonic, pacman-legal version (no dashes)
            # that still sorts below the next real tag.
            BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            PKGVER="${BASE#v}.r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          fi
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"
          echo "Building ${PKGVER}"

      - name: Assemble makepkg source tree
        run: |
          set -euo pipefail
          STAGE=build/arch
          mkdir -p "$STAGE"

          # Flat tarball: the PKGBUILD builds straight out of $srcdir.
          tar -czf "$STAGE/yeetbin-app-${{ steps.vers.outputs.pkgver }}.tar.gz" \
            *.go go.mod README.md LICENSE

          sed "s/@PKGVER@/${{ steps.vers.outputs.pkgver }}/g" \
            packaging/arch/PKGBUILD.in > "$STAGE/PKGBUILD"

          echo "--- PKGBUILD ---"
          cat "$STAGE/PKGBUILD"

      - name: Build, sign and index the package
        env:
          GPG_PRIVATE_KEY: ${{ secrets.ARCH_REPO_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.ARCH_REPO_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "::error::ARCH_REPO_GPG_KEY is not set — see packaging/arch/README.md"
            exit 1
          fi

          docker run --rm \
            -v "$PWD/build/arch:/work" \
            -e GPG_PRIVATE_KEY -e GPG_PASSPHRASE \
            -e REPO_NAME="$REPO_NAME" \
            archlinux:base-devel bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed go >/dev/null

              # makepkg refuses to run as root.
              useradd -m builder
              chown -R builder:builder /work

              # check() runs the test suite; a regression fails the publish.
              su builder -c "cd /work && makepkg --noconfirm --clean"

              # The PKGBUILD sets !debug, but exclude debug packages explicitly anyway:
              # picking one up would publish debug symbols in place of the program.
              mapfile -t PKGS < <(find /work -maxdepth 1 -name "*.pkg.tar.zst" \
                                       ! -name "*-debug-*" | sort)
              (( ${#PKGS[@]} == 1 )) || {
                echo "expected exactly one package, got ${#PKGS[@]}: ${PKGS[*]}"
                exit 1
              }
              PKG="${PKGS[0]}"
              echo "Built $(basename "$PKG")"

              # Detached signing without gpg-agent gymnastics.
              export GNUPGHOME=/tmp/gnupg
              mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import

              sign() {
                gpg --batch --yes --pinentry-mode loopback \
                    --passphrase "$GPG_PASSPHRASE" \
                    --detach-sign --no-armor "$1"
              }

              sign "$PKG"

              cd /work
              repo-add "${REPO_NAME}.db.tar.gz" "$(basename "$PKG")"
              # repo-add leaves .db/.files as symlinks to the .tar.gz; releases cannot
              # carry symlinks, so replace them with real copies under the names pacman
              # actually requests. The symlinks must go first — copying onto them would
              # abort with "are the same file".
              rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"
              cp "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db"
              cp "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files"
              sign "${REPO_NAME}.db.tar.gz"
              sign "${REPO_NAME}.db"
              sign "${REPO_NAME}.files.tar.gz"
              sign "${REPO_NAME}.files"

              chmod -R a+r /work
              ls -la /work
            '

      - name: Publish repository to the ktn-repo release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd build/arch

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "ktn-yeetbin pacman repository" \
              --notes "Rolling Arch repository for yeetbin-app. Setup: packaging/arch/README.md" \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            *.pkg.tar.zst *.pkg.tar.zst.sig \
            "${REPO_NAME}.db" "${REPO_NAME}.db.sig" \
            "${REPO_NAME}.db.tar.gz" "${REPO_NAME}.db.tar.gz.sig" \
            "${REPO_NAME}.files" "${REPO_NAME}.files.sig" \
            "${REPO_NAME}.files.tar.gz" "${REPO_NAME}.files.tar.gz.sig"

          # Drop superseded package assets so the release does not grow without bound.
          CURRENT=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -printf '%f\n' | head -n1)
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -E '\.pkg\.tar\.zst(\.sig)?$' \
            | grep -v "^${CURRENT}" \
            | while read -r stale; do
                echo "Deleting superseded asset: $stale"
                gh release delete-asset "$RELEASE_TAG" "$stale" --yes || true
              done

          echo "Published ${CURRENT}"
